# actual-http-api on Fly.io, next to the Actual server. The app name is not stored here;
# pass it on deploy (see README.md). ACTUAL_SERVER_URL is a Fly secret for the same reason.
# Pin the image tag to the version the Actual server runs (deploy/actual-server/fly.toml).

primary_region = "arn"

[build]
image = "jhonderson/actual-http-api:26.10.0"

[env]
ACTUAL_DATA_DIR = "/data"
NODE_ENV = "production"
PORT = "5007"
# Limit the API to one budget (Settings → Advanced settings → Sync ID):
# ALLOWED_BUDGET_SYNC_IDS = "00000000-0000-0000-0000-000000000000"

[mounts]
source = "actual_api_data"
destination = "/data"

[http_service]
internal_port = 5007
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
