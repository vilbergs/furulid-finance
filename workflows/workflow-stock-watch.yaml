id: 02586a45-e829-42c1-b5e9-0b459ccb2198
name: stock-watch
description: >-
  One look at a share on Avanza's public market-guide endpoint. The quote step
  prints the quote as one JSON object on stdout (last, best buy and sell,
  high, low, volume, market state) and a one-line summary on stderr, so every run is a
  record of the price. The publish step posts quote and trades to the HQ
  dashboard's Markets tab (POST /api/markets) unless `dashboard` is empty.
  The trades step lists today's trades at the target price or better (at or
  above it for a sell order, at or below for a buy order) since a given time,
  and prints their total volume on stdout; the assert passes once that volume
  is above zero, which is when an order at that price can have been filled.
  Run it on a loop or a timer to watch an open order. Uses command/shell
  because no published behavior type does a JSON GET yet. Avanza's public feed
  is delayed about 15 minutes.
version: 1
inputs:
  properties:
    orderbookId:
      type: string
      default: "636195"
      description: Avanza orderbook id, the number in the om-aktien URL (636195 is Sjöstrand Coffee B)
    target:
      type: number
      description: Price the last trade is compared with
    side:
      type: string
      enum: [sell, buy]
      default: sell
      description: sell counts trades at or above the target, buy at or below it
    since:
      type: string
      default: "09:00"
      description: Count trades from this local time today (HH:MM), normally when the order was placed
    dashboard:
      type: string
      default: "https://hq.vilberg.dev"
      description: HQ dashboard base URL to post the result to; empty skips the publish step
  required: [target]
jobs:
  - name: watch
    steps:
      - name: quote
        description: Quote as JSON on stdout, summary line on stderr
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: quote
          methodName: execute
          inputs:
            run: |
              curl -sf --max-time 20 -H 'Accept: application/json' "https://www.avanza.se/_api/market-guide/stock/$ORDERBOOK_ID" | python3 -c '
              import json, sys, datetime
              d = json.load(sys.stdin); q = d["quote"]; m = d["marketPlace"]
              t = datetime.datetime.fromtimestamp(q["timeOfLast"] / 1000).strftime("%H:%M:%S")
              print(d["name"], "last", q["last"], "at", t, "buy", q["buy"], "sell", q["sell"], "high", q["highest"], "low", q["lowest"], "vol", int(q["totalVolumeTraded"]), "market", m["currentStatus"], file=sys.stderr)
              print(json.dumps({"id": d["orderbookId"], "name": d["name"], "ticker": d["listing"]["tickerSymbol"], "currency": d["listing"]["currency"], "last": q["last"], "bid": q["buy"], "ask": q["sell"], "high": q["highest"], "low": q["lowest"], "change_percent": q["changePercent"], "volume": int(q["totalVolumeTraded"]), "time_of_last": t, "market": m["currentStatus"], "url": "https://www.avanza.se/aktier/om-aktien.html/" + d["orderbookId"]}, ensure_ascii=False), end="")
              '
            timeout: 30000
            env:
              ORDERBOOK_ID: ${{ inputs.orderbookId }}
      - name: trades
        description: Volume traded at the target or better since the given time on stdout, the trades on stderr
        dependsOn:
          - step: quote
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: trades
          methodName: execute
          inputs:
            run: |
              curl -sf --max-time 20 -H 'Accept: application/json' "https://www.avanza.se/_api/market-guide/stock/$ORDERBOOK_ID/trades" | python3 -c '
              import json, sys, datetime, os
              target = float(os.environ["TARGET"]); side = os.environ["SIDE"]
              h, m = os.environ["SINCE"].split(":")
              since = datetime.datetime.now().replace(hour=int(h), minute=int(m), second=0, microsecond=0)
              total = 0
              for t in json.load(sys.stdin):
                  if t.get("cancelled"): continue
                  when = datetime.datetime.fromtimestamp(t["dealTime"] / 1000)
                  ok = t["price"] >= target if side == "sell" else t["price"] <= target
                  if when >= since and ok:
                      total += t["volume"]
                      print(when.strftime("%H:%M:%S"), int(t["volume"]), "at", t["price"], t["buyerName"], "<-", t["sellerName"], file=sys.stderr)
              print(int(total), end="")
              '
            timeout: 30000
            env:
              ORDERBOOK_ID: ${{ inputs.orderbookId }}
              TARGET: ${{ string(inputs.target) }}
              SIDE: ${{ inputs.side }}
              SINCE: ${{ inputs.since }}
      - name: publish
        description: Post the quote and the trades at target to the HQ dashboard's Markets tab
        guard: ${{ inputs.dashboard == "" }}
        allowFailure: true
        dependsOn:
          - step: trades
            condition:
              type: succeeded
        task:
          type: behavior
          behaviorType: command/shell
          behaviorName: publish
          methodName: execute
          inputs:
            run: |
              payload=$(python3 -c '
              import json, os
              q = json.loads(os.environ["QUOTE"])
              q.update({"target": float(os.environ["TARGET"]), "side": os.environ["SIDE"], "since": os.environ["SINCE"],
                        "traded_at_target": int(os.environ["TRADED"] or 0),
                        "trades": [l.strip() for l in os.environ["TRADE_LINES"].splitlines() if l.strip()],
                        "source": "swamp stock-watch"})
              print(json.dumps(q, ensure_ascii=False))
              ') && curl -sf --max-time 20 -X POST -H 'Content-Type: application/json' --data-binary "$payload" "${DASHBOARD%/}/api/markets"
            timeout: 30000
            env:
              DASHBOARD: ${{ inputs.dashboard }}
              TARGET: ${{ string(inputs.target) }}
              SIDE: ${{ inputs.side }}
              SINCE: ${{ inputs.since }}
              QUOTE: ${{ data.latest("quote", "result").attributes.stdout }}
              TRADED: ${{ data.latest("trades", "result").attributes.stdout }}
              TRADE_LINES: ${{ data.latest("trades", "result").attributes.stderr }}
      - name: target-reached
        description: Fails until something has traded at the target or better since the given time
        dependsOn:
          - step: trades
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            double(data.latest("trades", "result").attributes.stdout) > 0.0
          message: "Nothing has traded at the target or better since the given time"
          severity: low
